name: Dependency remediation validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply compatible audit fixes
        run: npm audit fix --package-lock-only

      - name: Preserve generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 2

      - name: Require zero moderate-or-higher advisories
        run: npm audit --audit-level=moderate

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
