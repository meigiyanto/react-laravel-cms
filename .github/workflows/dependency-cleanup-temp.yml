name: Compatible npm audit remediation

on:
  push:
    branches:
      - chore/security-dependency-cleanup-phase-2

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.event.head_commit.message != 'chore(deps): apply compatible npm audit fixes'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/security-dependency-cleanup-phase-2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply non-breaking npm audit fixes
        run: npm audit fix --package-lock-only

      - name: Commit compatible lockfile updates
        working-directory: .
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "No compatible lockfile updates were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(deps): apply compatible npm audit fixes"
          git push origin chore/security-dependency-cleanup-phase-2

      - name: Verify no moderate-or-higher npm advisories remain
        run: npm audit --audit-level=moderate
